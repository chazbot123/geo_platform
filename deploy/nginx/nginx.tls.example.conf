events {}

http {
  limit_req_zone $binary_remote_addr zone=geo_public_api:10m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=geo_admin_api:10m rate=10r/s;

  server {
    listen 80;
    server_name geo.example.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name geo.example.com;

    ssl_certificate /etc/letsencrypt/live/geo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/admin/ {
      limit_req zone=geo_admin_api burst=40 nodelay;
      proxy_pass http://admin-api:8080/api/admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
      limit_req zone=geo_public_api burst=20 nodelay;
      proxy_pass http://admin-api:8080/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /health {
      proxy_pass http://admin-api:8080/health;
      proxy_set_header Host $host;
    }

    location /admin/ {
      proxy_pass http://admin-web/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin {
      return 302 /admin/;
    }

    location /releases/ {
      alias /var/www/releases/;
      autoindex off;
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control "public, max-age=300" always;
    }
  }
}
