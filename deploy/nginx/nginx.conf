events {}

http {
  limit_req_zone $binary_remote_addr zone=geo_public_api:10m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=geo_admin_api:10m rate=10r/s;

  server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location /api/admin/ {
      limit_req zone=geo_admin_api burst=40 nodelay;
      proxy_pass http://admin-api:8080/api/admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=geo_public_api burst=20 nodelay;
      proxy_pass http://admin-api:8080/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://admin-api:8080/health;
      proxy_set_header Host $host;
    }

    location /admin/ {
      proxy_pass http://admin-web/;
      proxy_set_header Host $host;
    }

    location = /admin {
      return 302 /admin/;
    }

    location /releases/ {
      alias /var/www/releases/;
      autoindex off;
      add_header X-Content-Type-Options nosniff;
      add_header Cache-Control "public, max-age=300";
    }
  }
}
