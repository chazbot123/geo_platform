services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geo_admin}
      POSTGRES_USER: ${POSTGRES_USER:-geo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-api:
    build:
      context: ../server/admin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-geo_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geo_admin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in the deployment environment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the deployment environment}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

  admin-web:
    build:
      context: ../server/admin-web
    restart: unless-stopped
    depends_on:
      - admin-api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - admin-api
      - admin-web
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - release-files:/var/www/releases:ro

volumes:
  postgres-data:
  release-files:
